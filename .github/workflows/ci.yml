name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cíl: každý PR i push do main projde buildem a testy na Windows i macOS.
# Po Phase C jsme přepnuli z "placeholder build" na "hard gate" — macOS
# Apple Silicon impl (GpuDetector, SystemMonitor, ComfyInstaller,
# KeychainKeyStore, Backend.Metal) je v kódu. CI ověří, že
# osx-arm64 publish se vůbec dá vyrobit; runtime tests potřebují skutečnou
# Apple Silicon mašinu (macos-14 runner) a pustí se až přidáme test mark.
jobs:
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Stavíme Tests projekt — ten transitivně postaví App + Core + Infrastructure
      # (App nereferencuje Tests, takže build App by Tests.dll nevyrobil a
      # `dotnet test --no-build` by ho nenašel). Tím je App build i nadále hard gate.
      - name: Build
        run: dotnet build AIStudio.Tests/AIStudio.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test AIStudio.Tests/AIStudio.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/test-results.trx'
          if-no-files-found: warn

  # macOS build na Apple Silicon runneru. macos-14 = M1 GitHub runner
  # (macos-latest aliases na něj v 2025, ale fixujeme explicitně pro stabilitu).
  build-macos:
    name: Build + tests (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (osx-arm64)
        run: dotnet restore -r osx-arm64

      - name: Build (osx-arm64)
        run: |
          dotnet build AIStudio.App/AIStudio.App.csproj \
            -c Release \
            -r osx-arm64 \
            --no-restore \
            -p:PublishReadyToRun=false

      # Pure-logic testy běží i na macOS — TokenProtection / TokenEstimator /
      # MacOsGpuDetectorTests (parser JSON, žádný shell call). Real-system
      # tests (system_profiler) by chybu nereportovaly i bez Mac runneru.
      #
      # BEZ --no-build: hlavní build výše je -r osx-arm64 (kvůli .app publish),
      # takže Tests.dll v plain net10.0/ neexistuje. `dotnet test` si Tests
      # postaví sám (pro default RID).
      - name: Run tests
        run: dotnet test AIStudio.Tests/AIStudio.Tests.csproj -c Release --logger "trx;LogFileName=test-results-macos.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: '**/test-results-macos.trx'
          if-no-files-found: warn

      # Publish .app bundle pro ověření, že CFBundle properties + Info.plist
      # produkuje funkční artefakt. Self-contained = nepotřebuje .NET runtime
      # nainstalovaný na cílovém Macu (uživatel si stáhne .app a pustí).
      - name: Publish (osx-arm64 .app)
        run: |
          dotnet publish AIStudio.App/AIStudio.App.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishReadyToRun=false \
            -o publish/osx-arm64

      - name: List publish output (sanity check)
        run: ls -la publish/osx-arm64
